name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # setup-node registers the tsc problem matcher, so tsc errors surface as
      # check-run ANNOTATIONS ({path, line, message}) — the signal the
      # resolver-core CI-fix agent seeding consumes.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
